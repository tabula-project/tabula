[project]
name = "tabula-graph"
version = "0.1.0"
description = "Tabula L3: Graphiti adapter over PostgreSQL + Apache AGE + pgvector. Derived knowledge graph for substrate consumers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tabula stewards" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "asyncpg>=0.30.0",      # PostgreSQL async driver
  "pgvector>=0.3.0",       # pgvector Python client
  "graphiti-core>=0.3.0",  # the framework itself; pinned conservatively
  "pydantic>=2.0",
  "fastmcp>=0.2.0",        # MCP server interface
  "httpx>=0.27",
]

[project.optional-dependencies]
embedding-local = [
  "sentence-transformers>=2.7.0",  # for nomic-embed-text and similar
]
embedding-openai = [
  "openai>=1.40.0",
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23.0",
  "pytest-postgresql>=6.0",  # ephemeral pg for tests
]

[project.scripts]
tabula-graph = "tabula_graph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabula_graph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
