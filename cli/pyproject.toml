[project]
name = "tabula-cli"
version = "0.1.0"
description = "Tabula CLI: chat client and tooling for the encrypted enclave."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tabula stewards" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
# `wire` is sibling-packaged here pre-#16/#27. Once those land they may
# move to a separate distribution; this pyproject can re-pin then.
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
tabula = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Two top-level packages: the CLI itself, and the wire stubs it depends on.
packages = ["../cli", "../wire"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
