$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tabula-project.org/schema/v1/types/vision.yaml
title: Tabula Vision
description: |
  The living "what we want our life to look like" doc. One per project,
  family, organization, or sovereign-self. The vision is the document that
  decisions, projects, events, and observations refer back to when asking
  "are we still aligned?"

  Distinct from `decision` (a specific commitment) and `project` (an
  undertaking). A vision is the long-arc shape; projects are the work that
  expresses it.

  Visions evolve. Always supersede rather than mutate — the trace of how
  the vision changed is part of the institutional memory.

allOf:
  - $ref: ../frontmatter-base.yaml
  - type: object
    properties:
      type:
        const: vision

    required:
      - canonical_id
      - title

    properties:
      canonical_id:
        type: string
        pattern: ^vision:[a-z0-9-]+$
        description: |
          Stable identifier. The vision for the family is `vision:family`;
          for a sovereign self, `vision:self`; for an org, `vision:<org-slug>`.

      title:
        type: string
        description: Short headline.

      scope:
        type: string
        description: |
          What this vision is for. Common: family, sovereign-self, org-X,
          project-X. Determines audience tier and supersession discipline.
        examples: [family, sovereign-self, org:tabula-project]

      time_horizon:
        type: string
        description: |
          Free-form. Common: 5-year, 10-year, lifetime, posthumous. Hints at
          how often the vision should be revisited.

      values:
        type: array
        description: |
          The principles or commitments that animate the vision. Distinct
          from goals; values are about how, goals are about what.
        items: {type: string}

      goals:
        type: array
        description: |
          Concrete outcomes the vision aims toward. Each goal should be
          referenceable from project records.
        items:
          type: object
          required: [id, summary]
          properties:
            id: {type: string, description: short id (g1, family-bigger, ...)}
            summary: {type: string}
            target: {type: [string, "null"], description: "deadline or condition"}

      review_cadence:
        type: string
        description: |
          When the vision should be revisited and possibly superseded.
        examples: [annually, every-quarter, on-major-life-event]

      participants:
        type: array
        description: |
          People who co-author or co-own this vision. For a family vision,
          adults; for a sovereign-self vision, just the self. Multi-author
          visions require joint supersession.
        items: {type: string, pattern: ^person:[a-z0-9-]+$}

examples:
  - id: 01HXAA9VISIONFAMILY
    type: vision
    created_at: 2026-05-04T00:00:00Z
    author: person:rjwalters
    audience: [family]
    classification: family-private
    canonical_id: vision:walters-family
    title: "Walters family — life vision"
    scope: family
    time_horizon: lifetime
    participants: [person:rjwalters, person:aubrey]
    review_cadence: annually
    values:
      - "Organize our lives around a vision so we are more likely to actually live the life we want — together."
      - "AI agent as peer, not service. Refuses to be recruited as ally."
    goals:
      - id: italy-home
        summary: Identify and acquire family home in Italy
        target: 2027
      - id: family-grow
        summary: Welcome second child (planned daughter)
        target: 2027-fall
    tags: [family-vision, bower-pilot]
