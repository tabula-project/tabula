#cloud-config
#
# Tabula enclave Gitea VM bootstrap.
#
# Idempotent on first boot:
#   1. Format the attached data disk if and only if it has no filesystem.
#   2. Mount it at /var/lib/gitea via fstab so it survives reboot.
#   3. Create the gitea user/group with $HOME on the data disk.
#   4. Fetch the pinned Gitea binary release into /usr/local/bin.
#   5. Render /etc/gitea/app.ini with the instance's internal IP as the bind
#      address (HTTP_ADDR), so Gitea never listens on 0.0.0.0.
#   6. Install and enable the gitea systemd unit.
#
# Trust assumptions documented in the module README:
#   - Gitea binary is fetched from dl.gitea.com over HTTPS. The Cloud NAT egress
#     allowlist must permit it (or a GCS mirror configured by the operator).
#   - First-boot admin seeding is intentionally NOT performed here; see README
#     for the recommended Secret Manager + `gitea admin user create` flow.

write_files:
  - path: /etc/systemd/system/gitea.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Gitea (Tabula enclave)
      After=network.target var-lib-gitea.mount
      Requires=var-lib-gitea.mount

      [Service]
      Type=simple
      User=gitea
      Group=gitea
      WorkingDirectory=/var/lib/gitea
      Environment=USER=gitea HOME=/var/lib/gitea GITEA_WORK_DIR=/var/lib/gitea
      ExecStart=/usr/local/bin/gitea web --config /etc/gitea/app.ini
      Restart=on-failure
      RestartSec=5s
      LimitNOFILE=65535

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/sbin/tabula-gitea-bootstrap.sh
    permissions: "0750"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      # Idempotent first-boot bootstrap for the Tabula enclave Gitea VM.
      # Safe to re-run: each step short-circuits if its result is already in place.
      set -euo pipefail

      GITEA_VERSION="${gitea_version}"
      DATA_DEVICE="/dev/disk/by-id/google-${data_disk_device_name}"
      DATA_MOUNT="/var/lib/gitea"
      GITEA_USER="gitea"
      GITEA_GROUP="gitea"
      APP_INI="/etc/gitea/app.ini"

      echo "[bootstrap] starting at $(date -Is)"

      # ---- Format data disk on first boot only ----
      # Wait briefly for the device to attach (cloud-init can race the disk attach).
      for i in $(seq 1 30); do
        if [ -b "$DATA_DEVICE" ]; then break; fi
        echo "[bootstrap] waiting for data disk $DATA_DEVICE..."
        sleep 2
      done

      if [ ! -b "$DATA_DEVICE" ]; then
        echo "[bootstrap] ERROR: data disk $DATA_DEVICE never appeared" >&2
        exit 1
      fi

      # blkid prints nothing and exits non-zero on a blank disk.
      if ! blkid "$DATA_DEVICE" >/dev/null 2>&1; then
        echo "[bootstrap] formatting blank data disk $DATA_DEVICE as ext4"
        mkfs.ext4 -F -L gitea-data "$DATA_DEVICE"
      else
        echo "[bootstrap] data disk already has a filesystem; skipping mkfs"
      fi

      mkdir -p "$DATA_MOUNT"

      # Add fstab entry by UUID (stable across device renames) if missing.
      DATA_UUID=$(blkid -s UUID -o value "$DATA_DEVICE")
      if ! grep -q "UUID=$DATA_UUID " /etc/fstab; then
        echo "[bootstrap] adding fstab entry for $DATA_DEVICE ($DATA_UUID)"
        echo "UUID=$DATA_UUID $DATA_MOUNT ext4 defaults,nofail 0 2" >> /etc/fstab
      fi

      if ! mountpoint -q "$DATA_MOUNT"; then
        mount "$DATA_MOUNT"
      fi

      # ---- Create gitea user/group with $HOME on the data disk ----
      if ! getent group "$GITEA_GROUP" >/dev/null; then
        groupadd --system "$GITEA_GROUP"
      fi
      if ! id -u "$GITEA_USER" >/dev/null 2>&1; then
        useradd --system \
          --gid "$GITEA_GROUP" \
          --home-dir "$DATA_MOUNT" \
          --shell /usr/sbin/nologin \
          "$GITEA_USER"
      fi
      install -d -m 0750 -o "$GITEA_USER" -g "$GITEA_GROUP" "$DATA_MOUNT"
      install -d -m 0750 -o "$GITEA_USER" -g "$GITEA_GROUP" "$DATA_MOUNT/custom"
      install -d -m 0750 -o "$GITEA_USER" -g "$GITEA_GROUP" "$DATA_MOUNT/data"
      install -d -m 0750 -o "$GITEA_USER" -g "$GITEA_GROUP" "$DATA_MOUNT/log"
      install -d -m 0750 -o root          -g root          /etc/gitea

      # ---- Fetch Gitea binary if missing or version mismatched ----
      INSTALLED_VERSION=""
      if [ -x /usr/local/bin/gitea ]; then
        INSTALLED_VERSION=$(/usr/local/bin/gitea --version 2>/dev/null | awk '{print $3}' || true)
      fi
      if [ "$INSTALLED_VERSION" != "$GITEA_VERSION" ]; then
        echo "[bootstrap] installing gitea $GITEA_VERSION (was: '$INSTALLED_VERSION')"
        TMPBIN=$(mktemp)
        # Pinned download URL. Operators may override the host by replacing
        # dl.gitea.com with a GCS mirror in their fork of the cloud-init.
        curl --fail --show-error --silent --location \
          -o "$TMPBIN" \
          "https://dl.gitea.com/gitea/$${GITEA_VERSION}/gitea-$${GITEA_VERSION}-linux-amd64"
        install -m 0755 -o root -g root "$TMPBIN" /usr/local/bin/gitea
        rm -f "$TMPBIN"
      else
        echo "[bootstrap] gitea $GITEA_VERSION already installed"
      fi

      # ---- Render /etc/gitea/app.ini bound to the instance's internal IP ----
      INTERNAL_IP=$(curl --fail --silent --header "Metadata-Flavor: Google" \
        http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces/0/ip)
      echo "[bootstrap] binding gitea HTTP listener to $INTERNAL_IP (no 0.0.0.0)"

      cat > "$APP_INI" <<EOF
      APP_NAME = Tabula Gitea
      RUN_USER = $GITEA_USER
      RUN_MODE = prod

      [server]
      PROTOCOL          = http
      DOMAIN            = ${internal_fqdn}
      ROOT_URL          = http://${internal_fqdn}/
      HTTP_ADDR         = $INTERNAL_IP
      HTTP_PORT         = 3000
      DISABLE_SSH       = false
      START_SSH_SERVER  = true
      SSH_PORT          = 2222
      SSH_LISTEN_HOST   = $INTERNAL_IP
      OFFLINE_MODE      = true

      [database]
      DB_TYPE = sqlite3
      PATH    = $DATA_MOUNT/data/gitea.db

      [repository]
      ROOT = $DATA_MOUNT/repos

      [security]
      INSTALL_LOCK   = true
      SECRET_KEY     =
      INTERNAL_TOKEN =

      [service]
      DISABLE_REGISTRATION              = true
      REQUIRE_SIGNIN_VIEW               = true
      ENABLE_CAPTCHA                    = false
      DEFAULT_ALLOW_CREATE_ORGANIZATION = false

      [log]
      MODE      = console
      LEVEL     = info
      ROOT_PATH = $DATA_MOUNT/log
      EOF
      chown root:"$GITEA_GROUP" "$APP_INI"
      chmod 0640 "$APP_INI"

      install -d -m 0750 -o "$GITEA_USER" -g "$GITEA_GROUP" "$DATA_MOUNT/repos"

      # ---- Enable + start the service ----
      systemctl daemon-reload
      systemctl enable --now gitea.service

      echo "[bootstrap] complete at $(date -Is)"

runcmd:
  - [/usr/local/sbin/tabula-gitea-bootstrap.sh]

${extra_user_data}
