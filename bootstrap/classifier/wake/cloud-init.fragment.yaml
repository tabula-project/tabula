# Cloud-init fragment for the Tabula classifier wake-signal helper.
#
# This fragment is meant to be merged into the classifier module's main
# cloud-init template (terraform/modules/classifier/cloud-init.yaml.tftpl,
# created in issue #17). It is *not* a standalone cloud-init file — it
# assumes the classifier module is already setting up package install and
# the systemd reload step.
#
# Merge contract (consumed by #17 once both PRs land):
#   * The values ${gpu_instance_name}, ${gpu_instance_zone},
#     ${gpu_project_id}, ${gpu_health_url}, and ${wake_port} must be
#     supplied by the templatefile() call in the classifier module.
#   * The ``tabula-wake`` user is created here; the ``tabula-bootstrap``
#     unit must run *before* this fragment's runcmd, since the bootstrap
#     creates /var/lib/tabula.
#
# Until #17 has merged this in, operators can drop this fragment's content
# into a manually authored cloud-init for testing — see the README in this
# directory.

write_files:
  # Wake target config — read by tabula_wake.config.load() as the file
  # fallback when metadata fields are unset. The metadata path is the
  # canonical source on a real classifier VM; this file exists for the
  # rare case where metadata is unreachable (e.g., GCP control-plane
  # incident) and for local debugging.
  - path: /etc/tabula/wake.json
    permissions: "0644"
    content: |
      {
        "project_id": "${gpu_project_id}",
        "zone": "${gpu_instance_zone}",
        "instance_name": "${gpu_instance_name}",
        "health_url": "${gpu_health_url}"
      }

  # systemd unit for the wake HTTP server. Mirrors the canonical copy at
  # bootstrap/classifier/wake/systemd/tabula-wake.service — keep in sync
  # if either changes.
  - path: /etc/systemd/system/tabula-wake.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Tabula classifier wake-signal HTTP server
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=tabula-wake
      Group=tabula-wake
      Environment=TABULA_WAKE_HOST=127.0.0.1
      Environment=TABULA_WAKE_PORT=${wake_port}
      Environment=TABULA_WAKE_TIMEOUT_S=90
      ExecStart=/usr/bin/python3 -m tabula_wake.server
      Restart=on-failure
      RestartSec=3
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      ReadWritePaths=/var/log/tabula
      PrivateTmp=true
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectControlGroups=true
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
      RestrictNamespaces=true
      LockPersonality=true
      MemoryDenyWriteExecute=true
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=tabula-wake

      [Install]
      WantedBy=multi-user.target

  # Convenience symlink so operators have ``/opt/tabula/wake-gpu`` available
  # as a stable path (matches the issue's acceptance criterion).
  - path: /opt/tabula/wake-gpu
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Thin wrapper so the canonical helper lives at /opt/tabula/wake-gpu.
      # Forwards all arguments to the installed console script.
      exec /usr/local/bin/wake-gpu "$@"

users:
  - name: tabula-wake
    system: true
    shell: /usr/sbin/nologin
    homedir: /var/lib/tabula-wake
    create_home: false

packages:
  - python3
  - python3-pip

runcmd:
  # Install the wake package. In production, the wheel is shipped via the
  # in-enclave Gitea or a private package mirror — we deliberately do NOT
  # pull from public PyPI on the classifier (trust posture). For now, a
  # local wheel under /opt/tabula/wheels/ is the integration point; #17
  # extends this fragment with the wheel-distribution mechanism.
  - [ pip3, install, --no-index, --find-links=/opt/tabula/wheels, tabula-wake ]
  - [ install, -d, -m, "0755", -o, root, -g, root, /var/log/tabula ]
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, tabula-wake.service ]
