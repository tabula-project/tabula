[pytest]
# Pytest config for the localhost e2e integration test (#34).
#
# This sub-tree is collected independently of the per-package pytest configs
# under ``etl/`` and ``l3/`` so the harness can probe the canonical
# ``tabula_wire`` / ``tabula_cli`` distributions (#57) without coupling to
# either workspace-local conftest.
asyncio_mode = auto
testpaths = .
