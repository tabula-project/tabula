[project]
name = "tabula-wire-crypto"
version = "0.1.0"
description = "Tabula wire crypto: Noise XX wrappers (initiator + responder) over dissononce."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tabula stewards" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]

dependencies = [
  # Pure-Python Noise Protocol Framework implementation.
  # Pinned to 0.34.x — see README "How to upgrade" before bumping.
  "dissononce>=0.34.3,<0.35",
  # Provides the X25519 / ChaCha20-Poly1305 primitives that dissononce calls into.
  # Loose pin so security updates flow through.
  "cryptography>=42.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabula_wire_crypto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
