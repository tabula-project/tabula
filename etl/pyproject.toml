[project]
name = "tabula-etl"
version = "0.1.0"
description = "Tabula L2→L1 distillation framework. Adapter framework for substrate consumers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tabula stewards" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.0",
  "aiosqlite>=0.20.0",     # working-memory tier reference impl
  "ulid-py>=1.1.0",
  "pyyaml>=6.0",
  "python-frontmatter>=1.1.0",  # parse markdown frontmatter
  "tabula-graph",           # for L3 upserts after distillation; sibling package
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
tabula-etl = "tabula_etl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabula_etl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
tabula-graph = { path = "../l3" }
