[project]
name = "tabula-cli"
version = "0.1.0"
description = "Tabula enclave lifecycle CLI: tabula enclave {up,down,status,ssh}."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tabula stewards" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  # `up` (#26) uses Typer for the operator-friendly help/prompts surface.
  # `down` (#28) shells out to terraform and gcloud for portability; SDK
  # extras (google-cloud-compute) live in [project.optional-dependencies]
  # so test environments do not need GCP auth installed.
  "typer>=0.12",
]

[project.optional-dependencies]
gcp-sdk = [
  "google-cloud-compute>=1.19.0",
]
test = [
  "pytest>=8.0",
]

[project.scripts]
tabula = "tabula_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabula_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
