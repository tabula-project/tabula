[project]
name = "tabula-cli"
version = "0.1.0"
description = "Tabula enclave lifecycle CLI: tabula enclave {up,down,status,ssh}."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tabula stewards" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  # No hard runtime deps for the down command — shells out to `terraform` and
  # `gcloud` for portability. SDKs (google-cloud-compute) are an optional
  # extra so test environments do not need GCP auth installed.
]

[project.optional-dependencies]
gcp-sdk = [
  "google-cloud-compute>=1.19.0",
]
test = [
  "pytest>=8.0",
]

[project.scripts]
tabula = "tabula_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabula_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
