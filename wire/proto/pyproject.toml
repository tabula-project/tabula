[project]
name = "tabula-wire"
version = "0.1.0"
description = "Tabula wire schema (protobuf bindings) for the Noise-framed chat channel."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tabula stewards" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  # protobuf >=7.34 is required because protoc 34.1 emits gencode that
  # depends on the v7 runtime API. See README for the version policy.
  "protobuf>=7.34",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The generated bindings live under gen/tabula/wire/v1/. Map the
# top-level `tabula` package directory there so consumers can write
# `from tabula.wire.v1 import ClientFrame`.
packages = ["gen/tabula"]

[tool.pytest.ini_options]
testpaths = ["tests"]
