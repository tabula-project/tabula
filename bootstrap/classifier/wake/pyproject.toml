[project]
name = "tabula-wake"
version = "0.1.0"
description = "Tabula classifier wake-signal helper. Wakes the enclave's GPU VM on demand using a narrowly scoped IAM permission."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tabula stewards" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "google-cloud-compute>=1.19.0",
  "flask>=3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
wake-gpu = "tabula_wake.cli:main"
tabula-wake-server = "tabula_wake.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabula_wake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
