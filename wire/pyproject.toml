[project]
name = "tabula-wire"
version = "0.1.0"
description = "Tabula transport: Noise-XX wire protocol, static-key tooling, and the `tabula` CLI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tabula stewards" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  # X25519 / ChaCha20-Poly1305 primitives + on-disk static-key format (#46).
  "cryptography>=42.0",
  # Pure-Python Noise Protocol Framework — drives the XX state machine in
  # ``tabula_wire.crypto.noise_xx`` (#18). Pinned to 0.34.x; review before bumping.
  "dissononce>=0.34.3,<0.35",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
tabula = "tabula_wire.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabula_wire"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
